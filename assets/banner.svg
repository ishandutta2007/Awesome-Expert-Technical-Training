<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; letter-spacing: 1.5px; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.55; }
    }

    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }

    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 8 8; animation: dashFlow 14s linear infinite; }
    .floating-node-1 { animation: floatCard1 4.5s ease-in-out infinite; }
    .floating-node-2 { animation: floatCard2 5s ease-in-out infinite 0.8s; }
    .floating-node-3 { animation: floatCard3 4s ease-in-out infinite 1.6s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Glowing Aura Orbs (Background Right) -->
  <circle cx="960" cy="150" r="130" fill="#6366f1" opacity="0.25" class="pulse-bg"/>
  <circle cx="1060" cy="80" r="85" fill="#06b6d4" opacity="0.25" class="pulse-bg"/>
  <circle cx="850" cy="220" r="75" fill="#10b981" opacity="0.2" class="pulse-bg"/>

  <!-- Dynamic Flow Paths -->
  <g opacity="0.45">
    <path d="M 640 210 Q 790 110 940 190 T 1150 90" fill="none" stroke="url(#line-grad)" stroke-width="2.5" class="animated-line"/>
    <path d="M 610 90 Q 760 230 910 110 T 1170 210" fill="none" stroke="url(#line-grad)" stroke-width="2" class="animated-line"/>
  </g>

  <!-- Floating Workflow Cards (Far Right, Foreground text is on Left) -->
  <g class="floating-node-1">
    <rect x="710" y="75" width="135" height="62" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <text x="777" y="103" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">⚡ Hands-on Labs</text>
    <text x="777" y="122" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Cloud &amp; Sandboxes</text>
  </g>

  <g class="floating-node-2">
    <rect x="875" y="145" width="145" height="65" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" opacity="0.95"/>
    <text x="947" y="173" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a5b4fc" text-anchor="middle">🧠 Skill IQ &amp; LMS</text>
    <text x="947" y="192" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Adaptive Assessments</text>
  </g>

  <g class="floating-node-3">
    <rect x="1045" y="75" width="130" height="62" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <text x="1110" y="103" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">🎓 Certifications</text>
    <text x="1110" y="122" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Verified Credentials</text>
  </g>

  <!-- Connective Dotted Lines -->
  <path d="M 845 106 L 875 145" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7"/>
  <path d="M 1020 160 L 1045 118" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7"/>

  <!-- Foreground Content: Title & Subtitle (Left Aligned, Clear Margin) -->
  <g transform="translate(55, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="44" width="280" height="28" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
    <text x="140" y="62" class="badge-text" text-anchor="middle">TECH TRAINING &amp; EDTECH ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="126" class="title">Awesome Expert Technical Training</text>

    <!-- Accent Gradient Line under title -->
    <rect x="0" y="142" width="530" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">Curated Enterprise SaaS Platforms, LMS Architectures &amp; Open-Source Tools</text>
    <text x="0" y="206" class="subtitle">For Cloud Certifications, Developer Upskilling &amp; Engineering Education</text>
  </g>
</svg>
